name: Translator API quality

on:
  push:
    branches: [fix/validate-api-inputs-20261123]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate HTTP request contracts
        run: npm test
      - name: Type-check and compile
        run: npm run build
